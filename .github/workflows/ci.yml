name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff pytest
          pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check .
      - name: Verify the published reference data set
        run: python3 tools/build_web_data.py --check
      - name: Test with pytest
        run: pytest --tb=short