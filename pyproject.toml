[tool.ruff]
line-length = 100
target-version = "py310"

# HW3/, HW3-1/ and HW3-2/ are the original course submission: they are kept
# byte-for-byte as handed in, so they are excluded from linting on purpose.
# New code (tools/, tests/) and the published demo (docs/) are linted.
extend-exclude = ["HW3", "HW3-1", "HW3-2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assertions are the point of a test suite
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
